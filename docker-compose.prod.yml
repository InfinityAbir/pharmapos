# =============================================================================
# PharmaPOS — PRODUCTION compose file (standalone; do NOT chain with the dev
# docker-compose.yml).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Production differences from the dev stack:
# - ASPNETCORE_ENVIRONMENT=Production, demo seed and startup auto-migrate OFF.
#   Migrations are applied explicitly BEFORE deploy (see docs/production.md).
# - Keycloak runs in production mode (`start`) on its OWN Postgres (kcdb) with
#   proxy headers + public hostname. The dev realm-export (demo users) is NEVER
#   imported here; the realm is created once per docs/production.md.
# - TLS terminates at `proxy` (nginx). api/web/keycloak are NOT published to
#   the host, except localhost-bound admin ports for SSH-tunnel access.
# - Postgres is tuned for production and publishes on localhost only (backups).
# - Resource limits + rotating JSON logs on every service.
# - The SPA runtime config is injected via config.json volume mount, so the web
#   image built by CI can be promoted unchanged across environments.
# =============================================================================
name: pharmapos-prod

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
      - -c
      - log_timezone=UTC
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Localhost only: backups/admin via SSH tunnel. Never expose publicly.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    logging: *prod-logging

  # Dedicated database for Keycloak. The app database and the identity
  # database must never share credentials or volumes.
  kcdb:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
      POSTGRES_USER: ${KC_DB_USER:?KC_DB_USER is required}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - kcdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:?} -d ${KC_DB_NAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    logging: *prod-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # Production mode: external DB, proxy headers, public hostname so issued
    # tokens and login URLs carry the browser-reachable issuer.
    command:
      - start
      - --http-enabled=true
      - --hostname=${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      - --proxy-headers=xforwarded
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL_HOST: kcdb
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:?KC_DB_USER is required}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      TZ: UTC
    depends_on:
      kcdb:
        condition: service_healthy
    ports:
      # Localhost only: direct admin access via SSH tunnel.
      - "127.0.0.1:${KEYCLOAK_PORT:-8090}:8080"
    volumes:
      - ./deploy/keycloak/themes/pharmapos:/opt/keycloak/themes/pharmapos:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 512M
    logging: *prod-logging

  api:
    image: ${API_IMAGE:-pharmapos-api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?};Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?}"
      # Production applies migrations explicitly (scripts/migrate-prod.sh) — never
      # on container startup, and never seeds demo data.
      Database__ApplyMigrationsOnStartup: "false"
      Database__SeedDemoData: "false"
      Keycloak__Authority: "http://keycloak:8080/realms/${KEYCLOAK_REALM:-pharmapos}"
      Keycloak__Audience: "${KEYCLOAK_AUDIENCE:-pharmapos-api}"
      Keycloak__ClientSecret: "${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}"
      Keycloak__ValidIssuers__0: "${KEYCLOAK_PUBLIC_ISSUER:?KEYCLOAK_PUBLIC_ISSUER is required}"
      Keycloak__RequireHttpsMetadata: "true"
      Cors__AllowedOrigins__0: "https://${PUBLIC_HOST:?PUBLIC_HOST is required}"
    # No published ports: reachable only via `proxy` on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    logging: *prod-logging

  web:
    image: ${WEB_IMAGE:-pharmapos-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Runtime SPA config: promote the same image across environments.
      - ./deploy/web/config.prod.json:/usr/share/nginx/html/config.json:ro
    # No published ports: served only via `proxy`.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *prod-logging

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      KEYCLOAK_PUBLIC_HOST: ${KEYCLOAK_PUBLIC_HOST:-${PUBLIC_HOST:?PUBLIC_HOST is required}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/proxy/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/proxy/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *prod-logging

volumes:
  postgres-data:
  kcdb-data:
  certbot-www:
