name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Restore
        run: dotnet restore PharmaPOS.slnx

      - name: Build
        run: dotnet build PharmaPOS.slnx --configuration Release --no-restore

      # Integration tests start an ephemeral PostgreSQL container via Testcontainers;
      # Docker is available on ubuntu-latest runners.
      - name: Test
        run: dotnet test PharmaPOS.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pharmacy-pos
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/pharmacy-pos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/PharmaPOS.Api/Dockerfile -t pharmapos-api:ci .

      - name: Build web image
        run: docker build -f frontend/pharmacy-pos/Dockerfile -t pharmapos-web:ci frontend/pharmacy-pos
