name: pharmapos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmapos}
      POSTGRES_USER: ${POSTGRES_USER:-pharmapos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmapos} -d ${POSTGRES_DB:-pharmapos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./deploy/keycloak/themes/pharmapos:/opt/keycloak/themes/pharmapos:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: src/PharmaPOS.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-pharmapos};Username=${POSTGRES_USER:-pharmapos};Password=${POSTGRES_PASSWORD}"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDemoData: "true"
      Keycloak__Authority: "${KEYCLOAK_AUTHORITY:-http://keycloak:8080/realms/pharmapos}"
      Keycloak__Audience: "${KEYCLOAK_AUDIENCE:-pharmapos-api}"
      Keycloak__ClientSecret: "${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}"
      Keycloak__ValidIssuers__0: "${KEYCLOAK_PUBLIC_ISSUER:-http://localhost:8090/realms/pharmapos}"
      Keycloak__RequireHttpsMetadata: "false"
      Cors__AllowedOrigins__0: "${WEB_ORIGIN:-http://localhost:4200}"
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend/pharmacy-pos
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  postgres-data:
